# Builds the browser version and publishes it to GitHub Pages.
# Runs only by hand from the Actions tab, on the main branch. There is no tag trigger on
# purpose: the default github-pages environment only lets the default branch deploy, so a
# tag push would build and then be refused. A push alone never deploys.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# The build job only reads the code. The deploy job asks for the extra rights itself.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The emsdk scripts run on this machine, so they are pinned to the exact commit of
      # the 6.0.13 tag. A moving branch could change the build, or run new code, unnoticed.
      - name: Install Emscripten
        run: |
          EMSDK_COMMIT=35659964bc2762fffec0d257997fb61475f765b7
          git init "$HOME/emsdk"
          git -C "$HOME/emsdk" fetch --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_COMMIT"
          git -C "$HOME/emsdk" checkout --detach FETCH_HEAD
          test "$(git -C "$HOME/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT"
          "$HOME/emsdk/emsdk" install 6.0.13
          "$HOME/emsdk/emsdk" activate 6.0.13
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          cmake --preset web
          cmake --build --preset web

      # The build writes site-files.txt, the list of every file the game needs
      # (page, script, wasm, manifest, offline worker, components, icons). Copying
      # that list keeps build system files out and needs no edit when a file is added.
      - name: Collect the site
        run: |
          mkdir site
          tr -d '\r' < build/web/site-files.txt | tar -C build/web -cf - -T - | tar -C site -xf -
          test -f site/index.html && test -f site/sw.js && test -f site/manifest.webmanifest
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish. The build job above holds no write rights.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
